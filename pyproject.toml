[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vibecoding"
version = "0.1.0"
description = "A focused implementation of Agent modules 3 (Action Execution) and 4 (Memory & Feedback Loop)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["agent*"]